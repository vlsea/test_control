<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Resto App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo"></div>
      <nav>
        <ul>
          <li class="menu"><a href="#Menu">Меню</a></li>
          <li class="sale"><a href="#Sale">Акции</a></li>
          <li class="about-us"><a href="#About-us">O нас</a></li>
          <li class="events"><a href="#Events">События</a></li>
          <li class="delivery-area">
            <a href="#Delivery-area">Зоны доставки</a>
          </li>
        </ul>
      </nav>
      <div class="contacts">
        <div class="order-timing">Прием заказов с 10:00 до 22:40</div>
        <div class="telephone"></div>
      </div>
    </header>
    <main class="frame25">
      <section class="frame23">
        <div class="Pizza">
          <a href="#" class="pizza-link"
            ><div class="pizza-image">
              <img src="images/Image - 01.svg" alt="Пицца" /></div
          ></a>
          <h3>Пицца</h3>
        </div>
        <div class="Bowl">
          <a href="#" class="Bowl-link"
            ><div class="bowl-image">
              <img src="images/Image - 02.svg" alt="Суп" /></div
          ></a>
          <h3>Супы</h3>
        </div>
        <div class="main-course">
          <a href="#" class="main-course-link"
            ><div class="main-course-image">
              <img src="images/Image - 03.svg" alt="Горячие блюда" /></div
          ></a>
          <h3>Горячие блюда</h3>
        </div>
        <div class="salads">
          <a href="#" class="salads-link"
            ><div class="salads-image">
              <img src="images/Image - 04.svg" alt="Салаты" /></div
          ></a>
          <h3>Салаты</h3>
        </div>
      </section>
      <span class="title">Меню</span>
    </main>
  </body>
</html>
