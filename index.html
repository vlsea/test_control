<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Resto App</title>
  </head>
  <body>
    <header>
      <div class="container header-inner">
        <img src="images/Logo.svg" alt="Логотип" class="logo" />
        <nav>
          <ul>
            <li><a href="#">Меню</a></li>
            <li><a href="#">Акции</a></li>
            <li><a href="#">О нас</a></li>
            <li><a href="#">События</a></li>
            <li><a href="#">Зоны доставки</a></li>
          </ul>
        </nav>
        <div class="contact-info">
          <p>+0 (123) 456 78-90</p>
          <span>Прием заказов с 10:00 до 22:40</span>
        </div>
      </div>
    </header>

    <main>
      <section class="container">
        <h1>Меню</h1>
        <div class="menu-grid">
          <a href="#" class="menu-card">
            <img src="./images/image_pizza.png" alt="Пицца" />
            <div class="menu-card-title">Пицца</div>
          </a>
          <a href="#" class="menu-card">
            <img src="./images/image_bowl.png" alt="Супы" />
            <div class="menu-card-title">Супы</div>
          </a>
          <a href="#" class="menu-card">
            <img src="./images/image_course.png" alt="Горячие блюда" />
            <div class="menu-card-title">Горячие блюда</div>
          </a>
          <a href="#" class="menu-card">
            <img src="./images/image_salad.png" alt="Салаты" />
            <div class="menu-card-title">Салаты</div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
